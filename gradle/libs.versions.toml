[versions]
shadow = "9.3.1"
netty = "4.2.8.Final"
disruptor = "4.0.0"
jline = "3.30.6"
log4j = "2.25.2"
slf4j = "2.0.17"
adventure = "5.1.0-SNAPSHOT"
jshepherd = "4.0.3"
terminal-console-appender = "1.3.0"
jetbrains-annotations = "26.0.2"
velocity-native = "3.3.0-SNAPSHOT"
cosine = "2.7"
guava = "33.5.0-jre"

[libraries]
netty = { module = "io.netty:netty-all", version.ref = "netty" }
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor"}
jline = { module = "org.jline:jline-terminal-jansi", version.ref = "jline" }
terminal-console-appender = { module = "net.minecrell:terminalconsoleappender", version.ref = "terminal-console-appender" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
velocity-native = { module = "com.velocitypowered:velocity-native", version.ref = "velocity-native" }
cosine = { module = "com.github.Endelith:cosine", version.ref = "cosine" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

jshepherd-core = { module = "de.bsommerfeld.jshepherd:core", version.ref = "jshepherd" }
jshepherd-toml = { module = "de.bsommerfeld.jshepherd:toml", version.ref = "jshepherd" }

slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

log4j = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }

adventure = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }

[bundles]
log4j = [
    "log4j", "log4j-core", "log4j-slf4j-impl"
]

jshepherd = [
    "jshepherd-core", "jshepherd-toml"
]

adventure = [
    "adventure", "adventure-nbt", "adventure-minimessage",
    "adventure-serializer-gson", "adventure-serializer-plain"
]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
